# =============================================================================
# KiteAI — Personal AI Auto-Trading Addon for Zerodha Kite
# =============================================================================
# IMPORTANT: Never commit this file with real credentials.
# Use .env for secrets, this file for trading parameters only.

system:
  mode: paper                  # paper (simulated) or live (real orders)
  log_level: INFO
  db_path: data/kiteai.db
  timezone: Asia/Kolkata

# ─── Zerodha Kite Connect ───────────────────────────────────────────────────
# Set these in .env file, NOT here. Listed for reference only.
# KITE_API_KEY=your_api_key
# KITE_API_SECRET=your_api_secret
# KITE_USER_ID=your_user_id
# KITE_PASSWORD=your_password
# KITE_TOTP_SECRET=your_totp_secret

# ─── Watchlist ──────────────────────────────────────────────────────────────
trading:
  exchange: NSE
  watchlist:
    - RELIANCE
    - TCS
    - INFY
    - HDFCBANK
    - ICICIBANK
    - SBIN
    - BAJFINANCE
    - ITC
    - HINDUNILVR
    - KOTAKBANK
    - TATAMOTORS
    - MARUTI
    - AXISBANK
    - LT
    - SUNPHARMA
    - TITAN
    - BHARTIARTL
    - WIPRO
    - HCLTECH
    - ADANIENT

  # Intraday settings
  intraday:
    enabled: true
    product: MIS                # MIS = intraday margin
    max_trades: 5

  # BTST (Buy Today Sell Tomorrow)
  btst:
    enabled: true
    product: NRML               # NRML = carry forward
    max_positions: 3
    target_pct: 0.03            # 3% target
    stoploss_pct: 0.015         # 1.5% stoploss

  # F&O (Futures & Options)
  fno:
    enabled: true
    exchange: NFO
    lot_size: 1
    strike_offset: 0            # 0=ATM, +1=OTM, -1=ITM
    expiry: weekly              # weekly or monthly

  # Market hours (IST)
  market_open: "09:15"
  market_close: "15:15"
  square_off_minutes_before: 10  # auto square-off MIS before close

# ─── Risk Management ───────────────────────────────────────────────────────
risk:
  max_daily_loss: 5000          # INR - hard stop for the day
  max_position_value: 100000    # INR per position
  max_open_positions: 5
  stop_loss_pct: 0.02           # 2% default SL
  take_profit_pct: 0.04         # 4% default TP
  max_trades_per_day: 20
  min_confidence: 0.60          # minimum AI confidence to trade
  kill_switch: false            # emergency stop all trading
  cooldown_minutes: 5           # wait between trades on same symbol

# ─── AI / ML Engine ────────────────────────────────────────────────────────
ai:
  primary_model: random_forest
  fallback_model: xgboost
  ensemble_mode: adaptive       # adaptive, simple, or single
  retrain_hours: 24
  lookback_days: 180
  min_confidence: 0.60
  prediction_horizon: 5         # bars ahead

  # Feature toggles
  regime_detection: true        # auto-detect market regime
  adaptive_ensemble: true       # dynamic model weighting
  multi_timeframe: true         # multi-TF signal alignment
  dynamic_sl_tp: true           # ATR/regime-based SL/TP
  volatility_sizing: true       # volatility-adjusted position sizing
  signal_quality_filter: true   # filter D-quality signals
  tilt_protection: true         # pause after consecutive losses

  # Model hyperparameters
  random_forest:
    n_estimators: 200
    max_depth: 12
  xgboost:
    n_estimators: 150
    max_depth: 8
    learning_rate: 0.05
  lstm:
    enabled: false              # enable if you have GPU/enough RAM
    seq_len: 30
    hidden_size: 64
    epochs: 50
  transformer:
    enabled: true
    d_model: 64
    n_heads: 4
    n_layers: 3
    seq_len: 30
    dropout: 0.2

# ─── Backtest ──────────────────────────────────────────────────────────────
backtest:
  initial_capital: 100000       # INR
  commission_pct: 0.0003        # Zerodha ~0.03% for intraday
  slippage_pct: 0.001           # 0.1% slippage estimate
  stt_pct: 0.001                # Securities Transaction Tax

# ─── Auto-Trading Schedule ─────────────────────────────────────────────────
scheduler:
  scan_interval_seconds: 60     # scan every 60 seconds
  retrain_cron: "0 8 * * 1"    # retrain weekly Monday 8 AM

# ─── API Server ────────────────────────────────────────────────────────────
api:
  host: 0.0.0.0
  port: 8000

# ─── Dashboard ─────────────────────────────────────────────────────────────
dashboard:
  port: 8501
